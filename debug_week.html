<!DOCTYPE html>
<html>
<head>
    <title>Debug Week Calculator</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .step { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .result { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Debug Week Calculator for November 1, 2025</h1>
    <div id="output"></div>
    
    <script src="/src/services/timeCalculator.js"></script>
    <script>
        const output = document.getElementById('output');
        
        // Simulate what happens on page load
        output.innerHTML += '<div class="step"><h2>Step 1: Get Today\'s Date</h2>';
        const today = new Date();
        output.innerHTML += `Today: ${today.toDateString()} (${today.getMonth() + 1}/${today.getDate()}/${today.getFullYear()})`;
        output.innerHTML += '</div>';
        
        // This is what should happen in getCurrentWeekInfo()
        output.innerHTML += '<div class="step"><h2>Step 2: Check October 2025 Work Weeks</h2>';
        
        // Manually call fridaysInMonth for October
        output.innerHTML += '<p>Checking October 2025 (month index 9)...</p>';
        output.innerHTML += '</div>';
    </script>
</body>
</html>
