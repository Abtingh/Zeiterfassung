version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/db/migration/*.up.sql"
    queries:
      - "internal/db/query/*.sql"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
