<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        .error-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #f5c6cb;
            background-color: #f8d7da;
            border-radius: 5px;
        }

        h1 {
            color: #721c24;
        }

        .actions {
            margin-top: 20px;
        }

        .actions a {
            margin: 0 10px;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <h1>Authentication Error</h1>
        <p>There was a problem with your authentication session. This could be due to a system error.</p>
        <p>Please try logging in again. If the problem persists, contact your system administrator.</p>

        <div class="actions">
            <a href="/login">Return to Login</a>
            <a href="mailto:admin@example.com">Contact Admin</a>
        </div>
    </div>
</body>

</html>
