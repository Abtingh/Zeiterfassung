<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student homepage</title>
    <link rel="stylesheet" href="../src/styles/home.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="header">
        <div id="logoContainer">
            <h2>Zeiterfassung</h2>
        </div>
        <div id="iconProfile">
            <a href="#">
                <img src="../assets/iconProfile.svg" alt="User Icon">
            </a>
            <div id="profileDropDown" class="dropdown-menu hidden">
                <ul>
                    <li><a href="#" id="profileLink">Profil</a></li>
                    <li><a href="#" id="resetPasswordLink">Passwort zurücksetzen</a></li>
                    <li><a href="#" id="logoutLink logoutBtn">Ausloggen</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div id="main">
        <div id="mainContent">
            <h2 class="nameHolder"></h2>
            <div class="weekOverview">
                <div class="monat"><p>Juni 2025</p></div>
                <div class="WochenStatus">
                    <div class="weekCard">
                        <div class="weekHolder"><p>1.Woche</p></div>
                        <div class="statusHolder accepted"><p>Bestätigt</p></div>
                    </div>
                    <!-- <div class="divider"></div> -->
                </div>
            </div>
        </div>
        <div id="navbar">
            <ul>
                <li><img src="../assets/iconHome.svg" alt="Home"><a href="#">Übersicht</a></li>
                <li><img src="../assets/iconHome.svg" alt="TimeAdding"><a href="#">Zeit Eintragen</a></li>
             </ul>
        </div>
    </div>
    <script src="../src/services/logout.js"></script>
    <script src="../src/services/profileDropdown.js"></script>
    <script src="../src/services/userInfo.js"></script>
</body>

</html>
