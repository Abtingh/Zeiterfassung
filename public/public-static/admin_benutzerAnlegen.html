<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Benutzer Anlegen</title>
    <link rel="stylesheet" href="../src/styles/home.css">
    <link rel="stylesheet" href="../src/styles/BenutzerVerwalten.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="header">
        <div id="logoContainer">
            <h2>Zeiterfassung</h2>
        </div>
        <div id="iconProfile">
            <a href="#">
                <img src="../assets/iconProfile.svg" alt="User Icon">
            </a>
            <div id="profileDropDown" class="dropdown-menu hidden">
                <ul>
                    <li><a href="#" id="profileLink">Profil</a></li>
                    <li><a href="/reset-passwort" id="resetPasswordLink">Passwort zurücksetzen</a></li>
                    <li><a href="#" id="logoutLink">Ausloggen</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div id="main">
        <div id="mainContent">
            <form id="formContainer">
                <div id="titleContainer">
                    <h2>Benutzer anlegen</h2>
                </div>
                <div id="inputGroup">
                    <div class="inputfield" id="firstnameHolder">
                        <label for="firstname">Vorname</label>
                        <input type="text" id="firstname" name="firstname" placeholder="Vorname" required>
                    </div>
                    <div class="inputfield" id="lastnameHolder">
                        <label for="lastname">Nachname</label>
                        <input type="text" id="lastname" name="lastname" placeholder="Nachname" required>
                    </div>
                    <div class="inputfield" id="emailHolder">
                        <label for="email">E-Mail</label>
                        <input type="email" id="email" name="email" placeholder="E-Mail" required>
                    </div>
                    <div class="inputfield" id="teamHolder">
                        <label for="team">Team</label>
                        <select id="team" name="team">
                            <option value="" selected>Kein Team</option>
                        </select>
                    </div>
                    <div class="inputfield" id="roleHolder">
                        <label for="role">Rolle</label>
                        <select id="role" name="role" required>
                            <option value="" selected disabled>Rolle wählen</option>
                            <option value="admin">Admin</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="student">Student</option>
                            <option value="accounting">Buchhalter</option>
                        </select>
                    </div>
                    <div class="inputfield" id="startDateHolder">
                        <label for="startDate">Startdatum</label>
                        <input type="date" id="startDate" name="startDate" required>
                    </div>
                    <div class="inputfield" id="generatedPasswordHolder">
                        <label for="generatedPassword">Passwort</label>
                        <input type="text" id="generatedPassword" name="generatedPassword"
                            placeholder="Passwort eingeben oder generieren">
                        <button type="button" id="generatePasswordBtn">Generieren</button>
                    </div>
                </div>
                <div id="buttonContainer">
                    <button type="button" id="cancelButton">Reset</button>
                    <button type="submit" id="submitButton">Anlegen</button>
                </div>
            </form>
        </div>
        <div id="navbar">
            <ul>
                <li><img src="/assets/iconHome.svg" alt="Home"><a href="/home">Übersicht</a></li>
                <li class="active"><img src="/assets/iconAddUser.svg" alt="Anlegen"><a href="/BenutzerAnlegen">Benutzer
                        anlegen</a></li>
                <li><img src="/assets/iconManageUser.svg" alt="Verwalten"><a href="/BenutzerVerwalten">Benutzer
                        verwalten</a></li>
                <li><img src="/assets/iconAddUser.svg" alt="Team"><a href="/TeamHinzufuegen">Team Hinzufügen</a></li>
                <li><img src="/assets/iconManageUser.svg" alt="Team"><a href="/TeamVerwalten">Team Verwalten</a></li>
            </ul>
        </div>
    </div>
    <script src="/src/services/logout.js"></script>
    <script src="/src/services/profileDropdown.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // Load teams for dropdown
            await loadTeams();

            // Set default start date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;

            // Generate initial password
            generatePassword();

            // Handle form submission
            document.getElementById('formContainer').addEventListener('submit', handleSubmit);

            // Handle reset button
            document.getElementById('cancelButton').addEventListener('click', resetForm);

            // Handle generate password button
            document.getElementById('generatePasswordBtn').addEventListener('click', generatePassword);
        });

        function generatePassword() {
            const length = 12;
            const charset = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }
            document.getElementById('generatedPassword').value = password;
        }

        async function loadTeams() {
            try {
                const response = await fetch('/admin/teams/list', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    console.error('Failed to load teams');
                    return;
                }

                const teams = await response.json();
                const teamSelect = document.getElementById('team');

                teams.forEach(team => {
                    const option = document.createElement('option');
                    option.value = team.id;
                    option.textContent = team.name;
                    teamSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading teams:', error);
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const password = document.getElementById('generatedPassword').value;
            if (!password) {
                alert('Bitte generieren Sie ein Passwort!');
                return;
            }

            const teamValue = document.getElementById('team').value;
            const teamId = teamValue ? parseInt(teamValue) : null;

            const userData = {
                first_name: document.getElementById('firstname').value,
                last_name: document.getElementById('lastname').value,
                email: document.getElementById('email').value,
                password: password,
                role: document.getElementById('role').value,
                team_id: teamId,
                start_date: document.getElementById('startDate').value
            };

            try {
                const response = await fetch('/admin/users/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    const generatedPwd = document.getElementById('generatedPassword').value;
                    alert('Benutzer erfolgreich angelegt!\n\nGeneriertes Passwort: ' + generatedPwd + '\n\nBitte notieren Sie dieses Passwort!');
                    resetForm();
                } else {
                    const error = await response.json();
                    alert('Fehler: ' + (error.error || 'Benutzer konnte nicht angelegt werden'));
                }
            } catch (error) {
                console.error('Error creating user:', error);
                alert('Fehler beim Anlegen des Benutzers');
            }
        }

        function resetForm() {
            document.getElementById('formContainer').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = today;
            generatePassword();
        }
    </script>
</body>

</html>
