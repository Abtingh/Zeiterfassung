<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Passwort</title>
    <link rel="stylesheet" href="/src/styles/home.css">
    <link rel="stylesheet" href="/src/styles/password_reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="header">
        <div id="logoContainer">
            <h2>Zeiterfassung</h2>
        </div>
        <div id="iconProfile">
            <a href="#">
                <img src="/assets/iconProfile.svg" alt="User Icon">
            </a>
            <div id="profileDropDown" class="dropdown-menu hidden">
                <ul>
                    <li><a href="#" id="profileLink">Profil</a></li>
                    <li><a href="#" id="resetPasswordLink">Passwort zurücksetzen</a></li>
                    <li><a href="#" id="logoutLink">Ausloggen</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div id="main">
        <div id="mainContent">
            <div id="resetPasswordBox">
                <div id="headerBox">
                    <h2>Reset Passwort</h2>
                </div>
                <form id="resetPasswordForm" action="/reset-passwort" method="POST">
                    <label for="currentPassword">Aktuelles Passwort</label>
                    <input type="password" id="currentPassword" name="currentPassword" placeholder="Aktuelles Passwort"
                        required>

                    <label for="newPassword">Neues Passwort</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Neues Passwort" required>

                    <label for="confirmNewPassword">Passwort wiederholen</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword"
                        placeholder="Passwort wiederholen" required>

                    <div id="buttonContainer">
                        <button type="button" id="cancelBtn">Abbrechen</button>
                        <button type="submit" id="confirmButton">Bestätigen</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="navbar">
            <ul>
                <li><img src="/assets/iconHome.svg" alt="Home"><a href="/home">Übersicht</a></li>
            </ul>
        </div>
    </div>
    <script src="/src/services/logout.js"></script>
    <script src="/src/services/profileDropdown.js"></script>
    <script src="/src/services/userInfo.js"></script>
    <script src="/src/services/passwordReset.js"></script>

</body>

</html>
